[project]
name = "auditoria-laboratorios-qt-llm"
version = "10.0.7"
description = "Auditoría SAIRC en Qt con reconocimiento remoto."
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.11.1", "openpyxl==3.1.5", "pandas==2.3.1",
    "SQLAlchemy==2.0.43", "pyodbc==5.2.0", "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.5"]
build = ["pyinstaller>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]
